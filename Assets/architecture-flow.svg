<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Animated FIMA system architecture</title>
  <desc id="desc">Requests move from the user through React, Express, services, and repositories to PostgreSQL, email, and Groq.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071b33"/><stop offset="1" stop-color="#102b4f"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#153b66"/><stop offset="1" stop-color="#0d2949"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0l10 5-10 5z" fill="#63e6be"/></marker>
    <style>.card{fill:url(#card);stroke:#2d6ca2;stroke-width:2}.label{fill:#f4f8fc;font:700 19px Arial,sans-serif;text-anchor:middle}.sub{fill:#a9c2d8;font:14px Arial,sans-serif;text-anchor:middle}.flow{fill:none;stroke:#63e6be;stroke-width:3;stroke-dasharray:8 9;marker-end:url(#arrow);animation:dash 1.2s linear infinite}.branch{fill:none;stroke:#65b7ff;stroke-width:2.5;stroke-dasharray:7 8;marker-end:url(#arrow);animation:dash 1.5s linear infinite}.pulse{fill:#63e6be;filter:url(#glow)}.blue{fill:#65b7ff}@keyframes dash{to{stroke-dashoffset:-34}}@media(prefers-reduced-motion:reduce){.flow,.branch{animation:none}}</style>
  </defs>
  <rect width="1200" height="430" rx="24" fill="url(#bg)"/>
  <text x="60" y="54" fill="#fff" font-family="Arial,sans-serif" font-size="25" font-weight="700">How data moves through FIMA</text>
  <text x="60" y="80" fill="#8eacc7" font-family="Arial,sans-serif" font-size="14">A layered REST architecture with database and external-service integrations</text>
  <path id="main" class="flow" d="M205 210H284M454 210H524M694 210H764M934 210H1004"/>
  <path id="mailPath" class="branch" d="M609 165V117H850V142"/>
  <path id="aiPath" class="branch" d="M609 255V316H850V286"/>
  <g transform="translate(55 165)"><rect class="card" width="150" height="90" rx="16"/><text class="label" x="75" y="39">Business user</text><text class="sub" x="75" y="64">Browser</text></g>
  <g transform="translate(284 165)"><rect class="card" width="170" height="90" rx="16"/><text class="label" x="85" y="39">React + Vite</text><text class="sub" x="85" y="64">Single-page UI</text></g>
  <g transform="translate(524 165)"><rect class="card" width="170" height="90" rx="16"/><text class="label" x="85" y="39">Express API</text><text class="sub" x="85" y="64">Routes + controllers</text></g>
  <g transform="translate(764 165)"><rect class="card" width="170" height="90" rx="16"/><text class="label" x="85" y="39">Services</text><text class="sub" x="85" y="64">Rules + repositories</text></g>
  <g transform="translate(1004 165)"><rect class="card" width="150" height="90" rx="16"/><text class="label" x="75" y="39">PostgreSQL</text><text class="sub" x="75" y="64">Operational data</text></g>
  <g transform="translate(775 55)"><rect class="card" width="150" height="62" rx="14"/><text class="label" x="75" y="28">SMTP</text><text class="sub" x="75" y="49">Workflow email</text></g>
  <g transform="translate(775 316)"><rect class="card" width="150" height="62" rx="14"/><text class="label" x="75" y="28">Groq</text><text class="sub" x="75" y="49">Market assistant</text></g>
  <circle r="6" class="pulse"><animateMotion dur="3.2s" repeatCount="indefinite"><mpath href="#main"/></animateMotion></circle>
  <circle r="5" class="blue"><animateMotion dur="2.4s" repeatCount="indefinite" begin=".4s"><mpath href="#mailPath"/></animateMotion></circle>
  <circle r="5" class="blue"><animateMotion dur="2.7s" repeatCount="indefinite" begin="1.1s"><mpath href="#aiPath"/></animateMotion></circle>
  <text x="600" y="407" fill="#7493af" font-family="Arial,sans-serif" font-size="12" text-anchor="middle">route → controller → service → repository</text>
</svg>
