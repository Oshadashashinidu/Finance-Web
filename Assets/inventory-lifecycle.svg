<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Animated FIMA inventory lifecycle</title>
  <desc id="desc">Inventory moves from supplier intake to FIFO batches, then to production issue, waste, or return, updating stock and summaries.</desc>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071b33"/><stop offset="1" stop-color="#102b4f"/></linearGradient>
    <filter id="glow2"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0l10 5-10 5z" fill="#63e6be"/></marker>
    <style>.box{fill:#102f54;stroke:#316f9f;stroke-width:2}.t{fill:#f5f9fd;font:700 17px Arial,sans-serif;text-anchor:middle}.s{fill:#9eb9d0;font:13px Arial,sans-serif;text-anchor:middle}.line{fill:none;stroke:#63e6be;stroke-width:3;stroke-dasharray:8 9;marker-end:url(#a2);animation:move 1.1s linear infinite}.muted{stroke:#4d8dbc}.dot{fill:#63e6be;filter:url(#glow2)}@keyframes move{to{stroke-dashoffset:-34}}@media(prefers-reduced-motion:reduce){.line{animation:none}}</style>
  </defs>
  <rect width="1200" height="500" rx="24" fill="url(#bg2)"/>
  <text x="60" y="53" fill="#fff" font-family="Arial,sans-serif" font-size="25" font-weight="700">Inventory lifecycle</text>
  <text x="60" y="79" fill="#8eacc7" font-family="Arial,sans-serif" font-size="14">Every movement consumes the oldest available batch and refreshes operational totals</text>
  <path id="top" class="line" d="M204 172H279M449 172H524M694 172H769M939 172H1014"/>
  <path id="issue" class="line muted" d="M854 212V275H268V318"/>
  <path id="waste" class="line muted" d="M854 212V275H583V318"/>
  <path id="return" class="line muted" d="M854 212V275H898V318"/>
  <path id="summary" class="line" d="M353 360H484M668 360H799M983 360H1014V442H939"/>
  <g transform="translate(54 132)"><rect class="box" width="150" height="80" rx="15"/><text class="t" x="75" y="33">Reorder alert</text><text class="s" x="75" y="56">Purchase request</text></g>
  <g transform="translate(279 132)"><rect class="box" width="170" height="80" rx="15"/><text class="t" x="85" y="33">Supplier</text><text class="s" x="85" y="56">Approve / reject</text></g>
  <g transform="translate(524 132)"><rect class="box" width="170" height="80" rx="15"/><text class="t" x="85" y="33">Stock intake</text><text class="s" x="85" y="56">Quantity + cost</text></g>
  <g transform="translate(769 132)"><rect class="box" width="170" height="80" rx="15"/><text class="t" x="85" y="33">FIFO batches</text><text class="s" x="85" y="56">Oldest stock first</text></g>
  <g transform="translate(1014 132)"><rect class="box" width="132" height="80" rx="15"/><text class="t" x="66" y="33">On hand</text><text class="s" x="66" y="56">Value + status</text></g>
  <g transform="translate(183 318)"><rect class="box" width="170" height="84" rx="15"/><text class="t" x="85" y="34">Production issue</text><text class="s" x="85" y="59">Consume stock</text></g>
  <g transform="translate(498 318)"><rect class="box" width="170" height="84" rx="15"/><text class="t" x="85" y="34">Waste</text><text class="s" x="85" y="59">Damage / expiry</text></g>
  <g transform="translate(813 318)"><rect class="box" width="170" height="84" rx="15"/><text class="t" x="85" y="34">Supplier return</text><text class="s" x="85" y="59">Notify by email</text></g>
  <g transform="translate(769 411)"><rect class="box" width="170" height="62" rx="15"/><text class="t" x="85" y="27">Daily summary</text><text class="s" x="85" y="48">Flows + alerts</text></g>
  <circle r="6" class="dot"><animateMotion dur="3.4s" repeatCount="indefinite"><mpath href="#top"/></animateMotion></circle>
  <circle r="5" fill="#65b7ff"><animateMotion dur="2.8s" repeatCount="indefinite" begin=".4s"><mpath href="#issue"/></animateMotion></circle>
  <circle r="5" fill="#ffcc66"><animateMotion dur="2.5s" repeatCount="indefinite" begin="1s"><mpath href="#waste"/></animateMotion></circle>
  <circle r="5" fill="#ff7f9f"><animateMotion dur="2.7s" repeatCount="indefinite" begin="1.5s"><mpath href="#return"/></animateMotion></circle>
  <circle r="6" class="dot"><animateMotion dur="3s" repeatCount="indefinite" begin=".8s"><mpath href="#summary"/></animateMotion></circle>
</svg>
